<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Research Radar</title>
<style>
  :root {
    --bg: #fafaf8; --card: #ffffff; --text: #1c1c1a; --muted: #6b6b66;
    --border: #e4e4df; --accent: #2f5fd0;
    --arxiv: #b5311f; --huggingface: #b07a00; --github: #2b7a4b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151516; --card: #1e1e20; --text: #ececea; --muted: #9a9a94;
      --border: #2e2e31; --accent: #7a9cf0;
      --arxiv: #f08a78; --huggingface: #e8b84a; --github: #6fcf97;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 20px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  input, select, button { font: inherit; color: var(--text); background: var(--card);
         border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
  input { flex: 1 1 200px; }
  button.chip[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  button { cursor: pointer; }
  .item { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
          padding: 14px 16px; margin-bottom: 12px; }
  .item h2 { font-size: 1.05rem; margin: 0 0 4px; line-height: 1.35; }
  .item a { color: var(--text); text-decoration: none; }
  .item a:hover { color: var(--accent); text-decoration: underline; }
  .meta { color: var(--muted); font-size: .82rem; display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 6px; }
  .tag { font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .tag.arxiv { color: var(--arxiv); } .tag.huggingface { color: var(--huggingface); } .tag.github { color: var(--github); }
  .summary { font-size: .92rem; margin: 0; color: var(--text); opacity: .85;
             display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<main>
  <h1>AI Research Radar</h1>
  <div class="sub" id="status">Loading…</div>

  <div class="controls">
    <input id="q" type="search" placeholder="Search titles and summaries…" aria-label="Search">
    <button class="chip" data-src="arxiv" aria-pressed="true">arXiv</button>
    <button class="chip" data-src="huggingface" aria-pressed="true">Hugging Face</button>
    <button class="chip" data-src="github" aria-pressed="true">GitHub</button>
    <select id="topic" aria-label="Topic"><option value="">All topics</option></select>
    <select id="sort" aria-label="Sort">
      <option value="new">Newest</option>
      <option value="score">Top score</option>
    </select>
  </div>

  <div id="list"></div>
</main>

<script>
const state = { items: [], sources: new Set(["arxiv", "huggingface", "github"]), q: "", sort: "new", topic: "" };
const SCORE_LABEL = { huggingface: "upvotes", github: "stars", arxiv: "" };
const TOPIC_LABEL = { ai: "AI / ML", math: "Math & algorithms" };  // unknown names show as-is
const topicsOf = (i) => i.topics || ["ai"];
const $ = (s) => document.querySelector(s);

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

function ago(iso) {
  const h = (Date.now() - new Date(iso)) / 36e5;
  if (h < 1) return "just now";
  if (h < 24) return Math.round(h) + "h ago";
  return Math.round(h / 24) + "d ago";
}

function render() {
  const q = state.q.toLowerCase();
  let rows = state.items.filter((i) =>
    (i.sources || [i.source]).some((s) => state.sources.has(s)) &&
    (!state.topic || topicsOf(i).includes(state.topic)) &&
    (!q || (i.title + " " + (i.summary || "")).toLowerCase().includes(q)));
  rows.sort((a, b) => state.sort === "score"
    ? (b.score || 0) - (a.score || 0)
    : new Date(b.first_seen) - new Date(a.first_seen));
  $("#list").innerHTML = rows.length ? rows.slice(0, 200).map((i) => {
    const srcs = (i.sources || [i.source]);
    const tags = srcs.map((s) => `<span class="tag ${s}">${esc(s)}</span>`).join(" ");
    const label = SCORE_LABEL[i.source] && i.score ? `<span>${i.score} ${SCORE_LABEL[i.source]}</span>` : "";
    const who = (i.authors || []).slice(0, 3).join(", ");
    return `<article class="item">
      <h2><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a></h2>
      <div class="meta">${tags}${i.category ? `<span>${esc(i.category)}</span>` : ""}${label}<span>${esc(who)}</span><span>${ago(i.first_seen)}</span></div>
      <p class="summary">${esc(i.summary)}</p></article>`;
  }).join("") : `<div class="empty">Nothing matches.</div>`;
}

document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => {
  const s = b.dataset.src;
  state.sources.has(s) ? state.sources.delete(s) : state.sources.add(s);
  b.setAttribute("aria-pressed", state.sources.has(s));
  render();
}));
$("#q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
$("#sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
$("#topic").addEventListener("change", (e) => { state.topic = e.target.value; render(); });

fetch("data/items.json", { cache: "no-cache" })
  .then((r) => r.json())
  .then((d) => {
    state.items = d.items;
    const topics = [...new Set(d.items.flatMap(topicsOf))].sort();
    $("#topic").insertAdjacentHTML("beforeend",
      topics.map((t) => `<option value="${esc(t)}">${esc(TOPIC_LABEL[t] || t)}</option>`).join(""));
    $("#status").textContent = `${d.items.length} items · updated ${ago(d.updated)}`;
    render();
  })
  .catch(() => { $("#status").textContent = "No data yet — run the “Update feed” workflow once."; });
</script>
</body>
</html>
